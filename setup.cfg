[metadata]
name = call-logs-processor
version = 0.1.0
description = Normalise Asterisk, Twilio and RingCentral call logs into a shared Call model
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
include = call_logs_processor*

[options.entry_points]
console_scripts =
    call-log-normalise = call_logs_processor.cli:run
